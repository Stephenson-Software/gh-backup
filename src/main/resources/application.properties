# GitHub Backup Tool Configuration
spring.application.name=gh-backup
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.github.backup=INFO

# Backup directory configuration
# Default uses user home directory for cross-platform compatibility
# Can be overridden with -Dbackup.directory=/custom/path
backup.directory=${user.home}/gh-backups

# Web application type - set to 'none' by default for CLI mode
spring.main.web-application-type=none

# Backup mode: 'cli' for command line, 'web' for web server
backup.mode=cli

# Version of this build, filled in by Maven resource filtering; sent as the
# 'version' tag of the usage-reporting startup event.
spring.application.version=@project.version@

# Usage reporting: gh-backup sends a 'startup' event (program name and version
# only) and a 'backup-completed' event (nothing else) to the trace service so
# the maintainers can see the tool is being used. Nothing about the users,
# organizations or repositories being backed up is sent. Turn it off with
# -Dusage.reporting.enabled=false or USAGE_REPORTING_ENABLED=false, or with
# TRACE_USAGE_REPORTING=off / DO_NOT_TRACK=1 in the environment, which the
# client checks first. Details:
# https://github.com/Stephenson-Software/trace#usage-reporting
usage.reporting.enabled=true
usage.reporting.endpoint=https://trace.danielstephenson.dev
usage.reporting.key=39GTkLaxl_bSbkaAdO9reeIO4LXjeygPH70g3cn4y7M
