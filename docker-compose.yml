services:
  gh-backup-daemon:
    build: .
    container_name: gh-backup-daemon
    restart: unless-stopped
    environment:
      # Set your GitHub personal access token here for higher API rate limits
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      
      # Comma-separated list of GitHub users/organizations to backup
      # Example: SCHEDULED_USERS=octocat,github,spring-projects
      - SCHEDULED_USERS=${SCHEDULED_USERS:-}

      # Delay between scheduled backups, in milliseconds
      # Leave empty for the default of 86400000 (24 hours)
      # Example: BACKUP_INTERVAL_MS=3600000
      - BACKUP_INTERVAL_MS=${BACKUP_INTERVAL_MS:-}

      # Optional: Custom backup directory inside container
      - BACKUP_DIRECTORY=/backups

      # Usage reporting to the maintainers' trace service (startup and
      # backup-completed events, nothing about what is backed up).
      # Set USAGE_REPORTING_ENABLED=false or TRACE_USAGE_REPORTING=off to turn
      # it off (DO_NOT_TRACK=1 too); see CONFIG.md and
      # https://danielstephenson.dev/usage-reporting
      - USAGE_REPORTING_ENABLED=${USAGE_REPORTING_ENABLED:-true}
      - TRACE_USAGE_REPORTING=${TRACE_USAGE_REPORTING:-}
      - DO_NOT_TRACK=${DO_NOT_TRACK:-}
    volumes:
      # Mount a local directory to persist backups
      - ./backups:/backups
    # Keep container running
    stdin_open: true
    tty: true
